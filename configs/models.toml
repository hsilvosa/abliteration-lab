# Model registry.
#
# Every repo and file name below was checked against the Hugging Face API on
# 2026-11-22. Sizes are the file sizes reported by the API (GB = 1e9 bytes).
# Claims in `card_claims` are the uploader's own numbers, not measurements of this repo.
#
# Fields:
#   id          local id; files land in <models_dir>/<group>/<id>/
#   group       core | extended | small | source
#   role        abliterated | baseline | source
#   format      gguf (single files) | hf (safetensors snapshot)
#   repo        Hugging Face repo id
#   files       exact file names (gguf) or allow patterns (hf)
#   optional    extra files (vision projector, MTP drafter); skipped unless --with-optional
#   baseline    id of the unmodified model used for paired comparison
#   size_gb     total size of `files`

# ---------------------------------------------------------------------------
# core: the three-way comparison proposed for the RTX 3060 12 GB, plus baselines
# ---------------------------------------------------------------------------

[[models]]
id = "gemma4-12b-qat-hauhaucs"
group = "core"
role = "abliterated"
format = "gguf"
repo = "HauhauCS/Gemma4-12B-QAT-Uncensored-HauhauCS-Balanced"
files = ["Gemma4-12B-QAT-Uncensored-HauhauCS-Balanced-Q4_K_M.gguf"]
optional = ["mmproj-Gemma4-12B-QAT-Uncensored-HauhauCS-Balanced-BF16.gguf"]
baseline = "gemma4-12b-qat-base"
quant = "Q4_K_M"
size_gb = 7.38
license = "gemma"
method = "Undisclosed uncensoring of the Gemma 4 12B QAT weights"
card_claims = "0/465 refusals (author test set)"

